name: Deploy to Cloud Run

# Every push to main redeploys palios.io. Auth uses Workload Identity
# Federation — GitHub mints a short-lived token, so there is no service
# account key stored anywhere.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: palios-site
  SERVICE: palios-site
  REGION: europe-west4

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/671297868122/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@palios-site.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://palios.io/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "palios.io did not return 200 after deploy" && exit 1
